<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">

    <rect width="800" height="1000" fill="#f6f1e8"/>
    <text x="48" y="78" fill="#3c2415" font-family="Georgia, 'Times New Roman', serif" font-size="28">Bønne &amp; Co</text>
    <text x="48" y="200" fill="#3c2415" font-family="Georgia, serif" font-size="64">Bag to cup</text>
    <text x="48" y="260" fill="#8a5a32" font-family="Georgia, serif" font-size="28">Four steps. No shop run.</text>
    
          <circle cx="120" cy="460" r="54" fill="#3c2415"/>
          <text x="120" y="474" text-anchor="middle" fill="#f6f1e8" font-family="Georgia, serif" font-size="36">1</text>
          <text x="120" y="560" text-anchor="middle" fill="#3c2415" font-family="Georgia, serif" font-size="28">Open</text>
        
          <circle cx="300" cy="460" r="54" fill="#3c2415"/>
          <text x="300" y="474" text-anchor="middle" fill="#f6f1e8" font-family="Georgia, serif" font-size="36">2</text>
          <text x="300" y="560" text-anchor="middle" fill="#3c2415" font-family="Georgia, serif" font-size="28">Grind</text>
        
          <circle cx="480" cy="460" r="54" fill="#3c2415"/>
          <text x="480" y="474" text-anchor="middle" fill="#f6f1e8" font-family="Georgia, serif" font-size="36">3</text>
          <text x="480" y="560" text-anchor="middle" fill="#3c2415" font-family="Georgia, serif" font-size="28">Pour</text>
        
          <circle cx="660" cy="460" r="54" fill="#3c2415"/>
